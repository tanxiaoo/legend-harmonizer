    color: "#ffbb22"
    observed: true
    description: "This class includes any geographic area characterized by a predominantly higher proportion of shrub cover compared to all other land cover elements. This class can include the possibility to have scattered trees. Shrubs are woody growth forms with a height less than 5 m. Lower herbaceous vegetation cover can be anyway present. The shrub phenology can be either evergreen or deciduous. Shrubland in this land cover class can be natural, semi-natural and cultivated."
  - code: 30
    name: "Grassland"
    color: "#ffff4c"
    observed: true
    description: "This class includes any geographic area characterized by a predominantly higher proportion of herbaceous vegetation cover compared to all other land cover elements. Grassland in this land cover class can be natural, semi-natural or cultivated. Shrubland and tree cover elements are absent or sparse. This class includes prairies, steppes, savannahs among various others. It may also contain uncultivated cropland areas (without harvest / bare soil period), such as fallows, along the reference year."
  - code: 40
    name: "Cropland"
    color: "#f096ff"
    observed: true
    description: "This class includes any geographic area characterized by a predominantly higher proportion of annual cultivated herbaceous crop cover that is sowed or planted and grown within a defined cropping cycle, resulting in at least one harvest within the 12 months after the sowing or planting date. Cropland produces an herbaceous cover during the growing season and is sometimes combined, to a lower proportion, with some woody vegetation. Areas characterized by a predominantly higher proportion of perennial cultivated woody crops are classified under tree cover or shrubland land cover classes depending on the dominant vegetation type. Greenhouses are considered as built-up."
  - code: 50
    name: "Herbaceous wetland"
    color: "#0096a0"
    observed: true
    description: "This class includes any geographic area characterized by a predominantly higher proportion of natural herbaceous vegetation that is permanently or regularly flooded by fresh, brackish, or salt water. It excludes unvegetated sediment (classified as bare/sparse vegetation), swamp forests (classified as tree cover) and mangroves."
  - code: 60
