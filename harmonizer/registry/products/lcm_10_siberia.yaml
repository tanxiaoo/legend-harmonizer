    description: "This class refers to any geographic area characterized by a predominantly higher proportion of tree cover compared to all other land cover elements. Other land cover elements including shrubs, herbaceous growth forms, built-up surface, and water, among others, can be present under the tree cover canopy. Trees in this land cover class are natural, semi-natural and cultivated. This class also includes tree covered areas seasonally or permanently flooded with fresh water, excluding mangroves."
  - code: 20
