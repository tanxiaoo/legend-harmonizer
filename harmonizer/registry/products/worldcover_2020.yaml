# Every class named in the legend CSV, with `observed:` recording whether
# it was actually found in this dataset's pixels. Classes declared by the
# published legend but absent here are KEPT and marked rather than dropped:
# a regional subset legitimately lacks some classes of a global legend, and
# the map legend greys those out instead of pretending they never existed
# (DESIGN.md 4.3).
legend:
  - code: 10
    name: "Tree cover"
    color: "#006400"
    observed: true
    description: "This class includes any geographic area dominated by trees with a cover of 10% or more. Other land cover classes (shrubs and/or herbs in the understorey, built-up, permanent water bodies, …) can be present below the canopy, even with a density higher than trees. Areas planted with trees for afforestation purposes and plantations (e.g. oil palm, olive trees) are included in this class. This class also includes tree covered areas seasonally or permanently flooded with fresh water except for mangroves."
    # PUM v2.0 Table 3: three LCCS alternatives -- A12A3 natural terrestrial,
    # A11A1 cultivated (plantations), A24A3 natural flooded (swamp forest).
    semantics:
      alternatives:
        - surface: vegetated
          cultivation: natural
          life_form: tree
          cover: [10, 100]
          height: [5, null]
          flooding: [0, 0]
        - surface: vegetated
          cultivation: cultivated
          life_form: tree
          cover: [10, 100]
          height: [5, null]
          flooding: [0, 0]
        - surface: vegetated
          cultivation: natural
          life_form: tree
          cover: [10, 100]
          height: [5, null]
          flooding: [1, 12]
  - code: 20
    name: "Shrubland"
    color: "#FFBB22"
    observed: true
    description: "This class includes any geographic area dominated by natural shrubs having a cover of 10% or more. Shrubs are defined as woody perennial plants with persistent and woody stems and without any defined main stem being less than 5 m tall. Trees can be present in scattered form if their cover is less than 10%. Herbaceous plants can also be present at any density. The shrub foliage can be either evergreen or deciduous."
    semantics:
      alternatives:
        - surface: vegetated
          cultivation: natural
          life_form: shrub
          cover: [10, 100]
          height: [0, 5]
          flooding: [0, 0]
  - code: 30
    name: "Grassland"
    color: "#FFFF4C"
    observed: true
    description: "This class includes any geographic area dominated by natural herbaceous plants (Plants without persistent stem or shoots above ground and lacking definite firm structure): (grasslands, prairies, steppes, savannahs, pastures) with a cover of 10% or more, irrespective of different human and/or animal activities, such as: grazing, selective fire management etc. Woody plants (trees and/or shrubs) can be present assuming their cover is less than 10%. It may also contain uncultivated cropland areas (without harvest/ bare soil period) in the reference year"
    semantics:
      alternatives:
        - surface: vegetated
          cultivation: natural
          life_form: herbaceous
          cover: [10, 100]
          flooding: [0, 0]
  - code: 40
    name: "Cropland"
    color: "#F096FF"
    observed: true
    description: "Land covered with annual cropland that is sowed/planted and harvestable at least once within the 12 months after the sowing/planting date. The annual cropland produces an herbaceous cover and is sometimes combined with some tree or woody vegetation. Note that perennial woody crops will be classified as the appropriate tree cover or shrub land cover type. Greenhouses are considered as built-up."
    # Two LCCS alternatives: A11A3 dry annual cropland, A23 aquatic cropland.
    semantics:
      alternatives:
        - surface: vegetated
          cultivation: cultivated
          life_form: herbaceous
          cover: [10, 100]
          flooding: [0, 0]
        - surface: vegetated
          cultivation: cultivated
          life_form: herbaceous
          cover: [10, 100]
          flooding: [1, 12]
  - code: 50
    name: "Built-up"
    color: "#FA0000"
    observed: true
    description: "Land covered by buildings, roads and other man-made structures such as railroads. Buildings include both residential and industrial building. Urban green (parks, sport facilities) is not included in this class. Waste dump deposits and extraction sites are considered as bare."
    semantics:
      alternatives:
        - surface: built
  - code: 60
    name: "Bare / sparse vegetation"
    color: "#B4B4B4"
    observed: true
    description: "Lands with exposed soil, sand, or rocks and never has more than 10 % vegetated cover during any time of the year"
    semantics:
