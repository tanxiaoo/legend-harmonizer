    name: "Permanent water bodies"
    color: "#0064C8"
    observed: true
    description: "This class includes any geographic area covered for most of the year (more than 9 months) by water bodies: lakes, reservoirs, and rivers. Can be either fresh or salt-water bodies. In some cases the water can be frozen for part of the year (less than 9 months)."
