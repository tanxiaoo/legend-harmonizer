legend:
  - {code: 10, name: "Tree cover", color: "#006400", description: "This class includes any geographic area dominated by trees with a cover of 10% or more. Other land cover classes (shrubs and/or herbs in the understorey, built-up, permanent water bodies, …) can be present below the canopy, even with a density higher than trees. Areas planted with trees for afforestation purposes and plantations (e.g. oil palm, olive trees) are included in this class. This class also includes tree covered areas seasonally or permanently flooded with fresh water except for mangroves."}
  - {code: 20, name: "Shrubland", color: "#ffbb22", description: "This class includes any geographic area dominated by natural shrubs having a cover of 10% or more. Shrubs are defined as woody perennial plants with persistent and woody stems and without any defined main stem being less than 5 m tall. Trees can be present in scattered form if their cover is less than 10%. Herbaceous plants can also be present at any density. The shrub foliage can be either evergreen or deciduous."}
  - {code: 30, name: "Grassland", color: "#ffff4c", description: "This class includes any geographic area dominated by natural herbaceous plants (Plants without persistent stem or shoots above ground and lacking definite firm structure): (grasslands, prairies, steppes, savannahs, pastures) with a cover of 10% or more, irrespective of different human and/or animal activities, such as: grazing, selective fire management etc. Woody plants (trees and/or shrubs) can be present assuming their cover is less than 10%. It may also contain uncultivated cropland areas (without harvest/ bare soil period) in the reference year"}
  - {code: 40, name: "Cropland", color: "#f096ff", description: "Land covered with annual cropland that is sowed/planted and harvestable at least once within the 12 months after the sowing/planting date. The annual cropland produces an herbaceous cover and is sometimes combined with some tree or woody vegetation. Note that perennial woody crops will be classified as the appropriate tree cover or shrub land cover type. Greenhouses are considered as built-up."}
  - {code: 50, name: "Built-up", color: "#fa0000", description: "Land covered by buildings, roads and other man-made structures such as railroads. Buildings include both residential and industrial building. Urban green (parks, sport facilities) is not included in this class. Waste dump deposits and extraction sites are considered as bare."}
  - {code: 60, name: "Bare / sparse vegetation", color: "#b4b4b4", description: "Lands with exposed soil, sand, or rocks and never has more than 10 % vegetated cover during any time of the year"}
  - {code: 70, name: "Snow and ice", color: "#f0f0f0", description: "This class includes any geographic area covered by snow or glaciers persistently"}
  - {code: 80, name: "Permanent water bodies", color: "#0064c8", description: "This class includes any geographic area covered for most of the year (more than 9 months) by water bodies: lakes, reservoirs, and rivers. Can be either fresh or salt-water bodies. In some cases the water can be frozen for part of the year (less than 9 months)."}
  - {code: 90, name: "Herbaceous wetland", color: "#0096a0", description: "Land dominated by natural herbaceous vegetation (cover of 10% or more) that is permanently or regularly flooded by fresh, brackish or salt water. It excludes unvegetated sediment (see 60), swamp forests (classified as tree cover) and mangroves see 95)"}
  - {code: 95, name: "Mangroves", color: "#00cf75", description: "Taxonomically diverse, salt-tolerant tree and other plant species which thrive in intertidal zones of sheltered tropical shores, 'overwash' islands, and estuaries."}
