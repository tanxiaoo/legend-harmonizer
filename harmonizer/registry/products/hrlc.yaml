# Product registry entry — single source of truth for this map's metadata and
# legend (docs/PIPELINE.md, section 2.5). CCI HRLC is the eventual real reference,
# read locally from a GeoTIFF. Names/colours below come from the ESA CCI HRLC
# 16-class legend (FAO LCCS); the codes are the raster's class_map_code values.

id: hrlc
display_name: CCI HRLC (16-class, static 2019) [eventual real reference]
provider: ESA CCI
role: reference          # reference | compare | embedding
kind: label              # label | embedding

access:
  method: local_raster
  # Path to the HRLC GeoTIFF once dropped in data/. The local adapter discovers
  # the tile in data/; this is advisory.
  path: data/            # TODO: point at the specific GeoTIFF when available

band: 1                  # first (and only) band of the class raster
resolution_m: 10.0
available_years: [2019]
crs: null                # TODO: derived from the raster's own CRS at load time

# Declared/expected extent (advisory only). HRLC has NO fixed footprint — whatever
# tile is currently in data/ defines it. The authoritative footprint is the
# rasterio bounds derived from the loaded source at run time (section 2). The box
# below is the Eastern Sahel extent of the tile used during development; treat it
# as advisory and reconcile against the loaded raster's actual bounds.
# (min_lon, min_lat, max_lon, max_lat) in EPSG:4326.
footprint: [9.9, -0.1, 43.3, 18.1]

licence: ESA CCI data policy
citation: >-
  ESA Climate Change Initiative — High Resolution Land Cover (HRLC), 16-class
  legend based on FAO LCCS.

# One entry per class. code = class_map_code in the raster.
# NOTE: descriptions below are drafted from the FAO LCCS meaning of each HRLC
# class name and are PROVISIONAL — verify/replace against the official ESA CCI
# HRLC product legend documentation before relying on them.
legend:
  - code: 10
    name: Tree cover evergreen broadleaf
    color: "#1a5b2c"
    description: >-
      Forest/woodland dominated by broadleaved trees that keep green foliage
      year-round (evergreen), canopy taller than ~5 m.
  - code: 20
    name: Tree cover evergreen needleleaf
    color: "#2e7d32"
    description: >-
      Forest/woodland dominated by needleleaved (coniferous) trees that keep
      foliage year-round (evergreen), canopy taller than ~5 m.
  - code: 30
    name: Tree cover deciduous broadleaf
    color: "#66bb6a"
    description: >-
      Forest/woodland dominated by broadleaved trees that shed their leaves
      seasonally (deciduous), canopy taller than ~5 m.
  - code: 40
    name: Tree cover deciduous needleleaf
    color: "#81c784"
    description: >-
      Forest/woodland dominated by needleleaved trees that shed their needles
      seasonally (deciduous), canopy taller than ~5 m.
  - code: 50
    name: Shrub cover evergreen
    color: "#c8e6c9"
    description: >-
      Land dominated by evergreen shrubs — woody perennials under ~5 m that keep
      foliage year-round.
  - code: 60
    name: Shrub cover deciduous
    color: "#a5d6a7"
    description: >-
      Land dominated by deciduous shrubs — woody perennials under ~5 m that shed
      leaves seasonally.
  - code: 70
    name: Grassland
    color: "#f9e79f"
    description: >-
      Herbaceous vegetation dominated by grasses and forbs, with woody cover
      below the shrub/tree threshold.
  - code: 80
    name: Croplands
    color: "#f1c40f"
    description: >-
      Cultivated, harvestable crops — rainfed or irrigated herbaceous crops and
      cropland mosaics.
  - code: 90
    name: Woody vegetation aquatic or regularly flooded
    color: "#5dade2"
    description: >-
      Woody vegetation (trees/shrubs) growing on land that is aquatic or regularly
      flooded — e.g. swamp forest and mangroves.
  - code: 100
    name: Grassland vegetation aquatic or regularly flooded
    color: "#85c1e9"
    description: >-
      Herbaceous vegetation on land that is aquatic or regularly flooded — marshes
      and seasonally inundated grasslands.
  - code: 110
    name: Lichen and mosses
    color: "#d7bde2"
    description: >-
      Land where lichens and mosses are the dominant vegetation, typical of tundra
      and cold or high-altitude environments.
  - code: 120
    name: Bare areas
    color: "#e0e0e0"
    description: >-
      Bare soil, sand, gravel or rock with little to no vegetation over the year —
      deserts and other barren land.
  - code: 130
    name: Built-up
    color: "#e74c3c"
    description: >-
      Artificial (sealed) surfaces — buildings, roads and other urban/rural
      settlement and infrastructure.
  - code: 141
    name: Open Water seasonal
    color: "#3498db"
    description: >-
      Open water present for only part of the year — seasonally inundated water
      bodies and ephemeral rivers/ponds.
  - code: 142
    name: Open Water permanent
    color: "#2471a3"
    description: >-
      Open water present year-round — permanent lakes, rivers, reservoirs and sea.
  - code: 150
    name: Permanent snow and ice
    color: "#ffffff"
    description: >-
      Land under year-round snow or ice cover — glaciers and perennial snowfields.
